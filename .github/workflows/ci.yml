name: ci
on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2022
        compiler:
          - msvc
        vcvarsall:
          - false
        cmake_generator:
          - Ninja
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
      - name: Cache
        uses: actions/cache@v3
        with:
          path: |
            ~/vcpkg
            ./build/vcpkg_installed
            ${{ env.HOME }}/.cache/vcpkg/archives
            ${{ env.XDG_CACHE_HOME }}/vcpkg/archives
            ${{ env.LOCALAPPDATA }}\vcpkg\archives
            ${{ env.APPDATA }}\vcpkg\archives
          key: ${{ runner.os }}-${{ matrix.compiler }}-${{ env.BUILD_TYPE }}-${{ hashFiles('**/CMakeLists.txt', './vcpkg.json')}}
          restore-keys: |
            ${{ runner.os }}-${{ env.BUILD_TYPE }}-

      - name: Setup Cpp
        uses: aminya/setup-cpp@v1
        with:
          compiler: ${{ matrix.compiler }}
          vcvarsall: ${{ contains(matrix.os, 'windows') && matrix.vcvarsall }}
          cmake: true
          ninja: true
          vcpkg: true
          conan: true
          task: true
          python: true

      # The mingw64 distribution used for the Windows gcc job ships its own CMake, and its libcurl has
      # no trust store ("no trust anchors configured"), so every HTTPS download made through it —
      # FetchContent, ExternalProject — fails certificate verification. Point it at the CA bundle that
      # Git for Windows installs. SSL_CERT_FILE is honored by CMake 3.25 and later.
      - name: Setup CA bundle for the mingw CMake
        if: ${{ contains(matrix.os, 'windows') && matrix.compiler == 'gcc' }}
        shell: pwsh
        run: |
          $bundle = "$env:ProgramFiles\Git\mingw64\etc\ssl\certs\ca-bundle.crt"
          if (Test-Path $bundle) {
            "SSL_CERT_FILE=$bundle" >> $env:GITHUB_ENV
          } else {
            Write-Host "::warning::No CA bundle found at $bundle"
          }

      - name: Test
        if: ${{ !cancelled() }}
        run: |
          task test
        env:
          CMAKE_GENERATOR: ${{ matrix.cmake_generator }}

      - name: Lint
        run: |
          task lint

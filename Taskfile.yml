# https://taskfile.dev/#6/installation
version: 3

includes:
  docker: ./docker/Taskfile.yml
  examples: ./examples/Taskfile.yml
  myproj:
    taskfile: ./tests/myproj/Taskfile.yml
    dir: ./tests/myproj
  install:
    taskfile: ./tests/install/Taskfile.yml
    dir: ./tests/install
  minimal:
    taskfile: ./tests/minimal/Taskfile.yml
    dir: ./tests/minimal
  emscripten:
    taskfile: ./tests/emscripten/Taskfile.yml
    dir: ./tests/emscripten
  rpi3:
    taskfile: ./tests/rpi3/Taskfile.yml
    dir: ./tests/rpi3
  rpi4:
    taskfile: ./tests/rpi4/Taskfile.yml
    dir: ./tests/rpi4
  rpi4-vcpkg:
    taskfile: ./tests/rpi4-vcpkg/Taskfile.yml
    dir: ./tests/rpi4-vcpkg
  docs:
    taskfile: ./docs/Taskfile.yml
    dir: ./docs
vars:
  CWD:
    sh: git rev-parse --show-toplevel

tasks:
  test:
    - task: test.cmake-regressions
    - task: myproj:test
    - task: myproj:test.release
    - task: install
    - task: vcpkg-parallel

  test.cmake-regressions:
    cmds:
      - cmake -G "Ninja Multi-Config" -S ./tests/libfuzzer -B ./build/regressions/libfuzzer -DPROJECT_OPTIONS_ROOT={{.CWD}} {{.CMAKE_ARGS}}
      - cmake -G "Ninja Multi-Config" -S ./tests/emscripten-sanitizers -B ./build/regressions/emscripten-sanitizers {{.CMAKE_ARGS}}
      - cmake -G "Ninja Multi-Config" -S ./tests/hardening-flags -B ./build/regressions/hardening-flags {{.CMAKE_ARGS}}
      - cmake -DTEST_ROOT=./build/regressions/sanitizer-runtime -P ./tests/sanitizer-runtime/msvc-runtime.cmake
      - cmake -DTEST_ROOT=./build/regressions/sanitizer-runtime -P ./tests/sanitizer-runtime/automatic.cmake

  vcpkg-parallel:
    cmds:
      - cmake -S ./tests/vcpkg-parallel -B ./build/vcpkg-parallel -G "Ninja Multi-Config" {{.CMAKE_ARGS}}
      - cd ./build/vcpkg-parallel && ctest --parallel 2 -C Debug --output-on-failure

  lint.cspell: npx -y cspell lint --no-progress --show-suggestions

  lint.clang-format:
    cmds:
      - cmd: powershell -c '$files=(git ls-files --exclude-standard); foreach ($file in $files) { if ((get-item $file).Extension -in ".cpp", ".hpp", ".c", ".cc", ".cxx", ".hxx", ".ixx") { clang-format -i -style=file $file } }'
        platforms: [windows]
      - cmd: git ls-files --exclude-standard | grep -E '\.(cpp|hpp|c|cc|cxx|hxx|ixx)$' | xargs clang-format -i -style=file
        platforms: [linux, darwin]

  lint.cmake:
    cmds:
      - cmd: powershell -c '$files=(git ls-files --exclude-standard); foreach ($file in $files) { $item=(get-item $file); if (($item.Name -eq "CMakeLists.txt") -or ($item.Extension -in ".cmake")) { cmake-format --in-place $file; cmake-lint $file {{.CMAKE_LINT_FLAGS}} } }'
        platforms: [windows]
      - cmd: git ls-files --exclude-standard | grep -E '(CMakeLists\.txt)|(\.(cmake))$' | xargs cmake-format --in-place | xargs cmake-lint {{.CMAKE_LINT_FLAGS}}
        platforms: [linux, darwin]
    vars:
      CMAKE_LINT_FLAGS: --disabled-codes C0103 C0301 R0912 R0915 R0913 --suppress-decorations

  lint:
    deps:
      - lint.cspell
      - lint.clang-format
      - lint.cmake
    cmds:
      - task: myproj:lint
      - task: install:lint
      - task: minimal:lint
      - task: emscripten:lint
      - task: rpi4-vcpkg:lint

  clean:
    deps:
      - myproj:clean
      - install:clean
      - minimal:clean
    cmds:
      - cmd: powershell -c 'function rmrf($path) { if (test-path $path) { rm -r -force $path }}; rmrf ./install; rmrf ./build'
        platforms: [windows]
      - cmd: rm -rf ./install ./build
        platforms: [linux, darwin]

  docs:
    deps:
      - docs:docs
  docs.preview:
    deps:
      - docs:docs.preview
  docs.deploy:
    deps:
      - docs:docs.deploy
